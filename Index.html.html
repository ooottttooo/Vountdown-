<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown zum 15.12.2026, 17:01</title>
    <style>
      :root {
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        color: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: radial-gradient(circle at 30% 20%, #1e293b, #0f172a 70%);
        padding: 2rem 1rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(1.2rem, 3vw, 2rem);
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .grid {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .cell {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1rem;
        padding: 1.2rem 1.4rem;
        min-width: 6.5rem;
      }
      .value {
        font-size: clamp(2.2rem, 6vw, 3.5rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #94a3b8;
        margin-top: 0.4rem;
      }
      .datetime {
        color: #94a3b8;
        font-size: 0.95rem;
      }
      .done { display: none; color: #4ade80; font-size: 1.5rem; font-weight: 700; }
      .wrap.ended .grid, .wrap.ended h1 { display: none; }
      .wrap.ended .done { display: block; }
      footer {
        color: #475569;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap">
      <h1>Noch bis zum 15.12.2026, 17:01 Uhr</h1>
      <div class="grid">
        <div class="cell"><div class="value" id="d">–</div><div class="label">Tage</div></div>
        <div class="cell"><div class="value" id="h">–</div><div class="label">Stunden</div></div>
        <div class="cell"><div class="value" id="m">–</div><div class="label">Minuten</div></div>
        <div class="cell"><div class="value" id="s">–</div><div class="label">Sekunden</div></div>
      </div>
      <p class="done">🎉 Zeitpunkt erreicht: 15.12.2026, 17:01 Uhr</p>
      <p class="datetime" id="target"></p>
    </div>
    <footer>Lokal gespeicherte Datei – funktioniert ohne Internet.</footer>
    <script>
      const target = new Date(2026, 11, 15, 17, 1, 0); // 15. Dezember 2026, 17:01 (lokale Zeit)
      const fmt = target.toLocaleString("de-DE", { dateStyle: "full", timeStyle: "short" });
      document.getElementById("target").textContent = "Zielzeitpunkt: " + fmt;

      const el = { d: document.getElementById("d"), h: document.getElementById("h"),
                   m: document.getElementById("m"), s: document.getElementById("s") };

      function tick() {
        const diff = target - new Date();
        if (diff <= 0) {
          document.getElementById("wrap").classList.add("ended");
          return;
        }
        const s = Math.floor(diff / 1000);
        el.d.textContent = Math.floor(s / 86400);
        el.h.textContent = Math.floor(s / 3600) % 24;
        el.m.textContent = Math.floor(s / 60) % 60;
        el.s.textContent = s % 60;
        setTimeout(tick, 250);
      }
      tick();
    </script>
  </body>
</html>
